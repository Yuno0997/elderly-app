# XAMPP Apache snippet for Elderly App (UI + API via one domain)
#
# What it does:
# - Serves the built frontend from /elderly-app/ (copy build/ -> C:\xampp\htdocs\elderly-app\)
# - Proxies /api/* to the Node backend on http://127.0.0.1:4000
#
# How to use:
# 1) Enable these modules in Apache (httpd.conf):
#    - LoadModule proxy_module modules/mod_proxy.so
#    - LoadModule proxy_http_module modules/mod_proxy_http.so
#    - LoadModule rewrite_module modules/mod_rewrite.so
# 2) Include this file (httpd.conf):
#    Include "C:/Users/Yuno/Desktop/Elderly App/xampp/apache-elderly-app.conf"
#    (or copy this file into C:/xampp/apache/conf/extra and Include it from there)
# 3) Restart Apache.

ProxyRequests Off
ProxyPreserveHost On

# Forward API calls from Apache -> Node backend
ProxyPass "/api" "http://127.0.0.1:4000/api"
ProxyPassReverse "/api" "http://127.0.0.1:4000/api"

# Optional hardening for backend-bound requests
<Location "/api">
  Require all granted
</Location>

