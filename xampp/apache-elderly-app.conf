# XAMPP Apache snippet for Elderly App (UI + API via one domain)
#
# What it does:
# - Serves the built frontend from /elderly-app/ (copy build/ -> C:\xampp\htdocs\elderly-app\)
# - Proxies /api/* to the Node backend on http://127.0.0.1:4000
#
# How to use:
# 1) Enable these modules in Apache (httpd.conf):
#    - LoadModule proxy_module modules/mod_proxy.so
#    - LoadModule proxy_http_module modules/mod_proxy_http.so
#    - LoadModule rewrite_module modules/mod_rewrite.so
# 2) Include this file from httpd.conf, e.g.:
#    Include "C:/xampp/apache/conf/extra/apache-elderly-app.conf"
#    The repo ships scripts/sync-xampp-apache-config.ps1 to copy this snippet there.
# 3) Restart Apache.

ProxyRequests Off
ProxyPreserveHost On

# Forward API calls from Apache -> Node backend
ProxyPass "/api" "http://127.0.0.1:4000/api"
ProxyPassReverse "/api" "http://127.0.0.1:4000/api"

# Same app under /elderly-app/ (built with BASE_PATH=/elderly-app/) uses /elderly-app/api/...
ProxyPass "/elderly-app/api" "http://127.0.0.1:4000/api"
ProxyPassReverse "/elderly-app/api" "http://127.0.0.1:4000/api"

# Optional hardening for backend-bound requests
<Location "/api">
  Require all granted
</Location>

